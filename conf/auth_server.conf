// ProjectPAULA — AuthServer (account login :9980). The client connects here first;
// it looks up the account name (no password in v0.1: the name is the key), refuses
// unknown or banned accounts, issues a token into login_tokens, and sends the
// client to the char-select server (LoginServer :8001).
port: 9980
io_threads: 2

// Address to listen on: 0.0.0.0 = every interface (players connect here), or one
// IPv4 address of this machine.
bind_ip: 0.0.0.0

// Log detail: debug | info | warn | error (debug logs every packet: large and slow).
log_level: info

// MariaDB (accounts + login_tokens)
db_host: 127.0.0.1
db_port: 3307
db_user: root
db_pass:
db_name: janus

// Client packet cipher
paula_mode: true
sbox_path: tools/capture/sbox_cora.bin

// Where to send the client after login (the char-select LoginServer); also the
// address of the default island below when no island_N line is given. For players
// on other machines use the address they reach (your public IP), here and in island_N.
char_server_ip: 127.0.0.1
char_server_port: 8001

// Server select = the retail FirstLoginSvr world table, one line per island:
//   island_N: world, island no, world name, island name, ip, port[, open[, open to all]]
// - the button shows the island name; the world name becomes the window title
//   "Trickster <world name>" once connected.
// - picking an island sends the client to THAT line's ip:port (its LoginServer).
// - open 0 = listed but refused; open to all 0 = listed for GM accounts only.
// - the client lists up to 6; with exactly 2 lines it opens its two-world window
//   instead, which shows no names at all (the old "two worlds, no island" screen).
// Eternal Paula had one island, "Ruby Island" (FirstLoginSvrW logs, 2025-05).
island_1: 1, 1, Paula, Ruby Island, 127.0.0.1, 8001
