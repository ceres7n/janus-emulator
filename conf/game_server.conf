// ProjectPAULA — GameServer (in-world zones)
// Lines are "key: value". Everything after // or # is a comment, so a value cannot contain them.
game_port: 8002

// The public IPv4 address players reach this server on. It is sent to the client in S2C 154 on
// every portal / town restart (the client reconnects to it) and, unless system_ip is set, as the
// community address (S2C 0x1585). 127.0.0.1 only works for a client on this PC: set the server's
// public (or LAN) IPv4 for remote players, the same address as login_server.conf game_server_ip.
// The login ticket is bound to the player's address: the LoginServer and this server must be reached
// by the same route (on the server PC itself, with a public game_ip, the launcher's LoginIP must be
// the public address too, which needs NAT loopback on the router).
game_ip: 127.0.0.1

// The local address the game and community ports listen on (0.0.0.0 = every interface).
bind_ip: 0.0.0.0

// Worker threads. Keep 1 for the beta: the world state is not locked for several threads.
io_threads: 1

// Log level: debug | info | warn | error (debug adds per-packet lines and hex dumps).
log_level: info

// Community port (the retail SystemServer): the client opens a second connection to it for the
// party, the party board, whispers and friends. Open / forward it like game_port when players
// connect from outside. system_ip is the address the client is told (defaults to game_ip).
system_port: 8003
// system_ip: 127.0.0.1

// MariaDB
db_host: 127.0.0.1
db_port: 3307
db_user: root
db_pass:
db_name: janus

// Client packet cipher (the KR client always uses it: keep paula_mode true)
paula_mode: true
sbox_path: tools/capture/sbox_cora.bin

// MasterServer hub (internal: keep 127.0.0.1 and never open port 9010 to the internet)
master_ip: 127.0.0.1
master_port: 9010

// Death screen "Go to Town" destination:
//   last = the last town you visited (retail behavior, default)
//   zone = the town of the place where you died (db/maps_db.yml "Town";
//          maps without one fall back to the last town visited)
restart_town: last

// Folder of the maps' .md3 files (db/maps_db.yml FileName, looked up by file
// name). Read like the retail GameServer: dropped items avoid blocked cells.
map_path: data/map

// Post box: minutes between a player's post box syncs (new mail shows up then, or on
// opening a list). Retail: 15 (0 or less also means 15). Set it low only to test mail.
post_sync_minutes: 15

// Megaphone queue: ms between two TBN Megaphone broadcasts (MasterServer.ini MegaphoneDelay;
// retail 18000; 0 = none go out).
megaphone_delay_ms: 18000
// The world name shown in a megaphone line ("[header] <name> - text").
megaphone_island_name: Paula

// Game data files: every table is read from db/ (the maps from map_path), relative to the working
// folder, so start the server from its own folder. Each one can be pointed elsewhere with its own
// <name>_path key, e.g.
//   item_db_path: db/item_db.yml        maps_db_path: db/maps_db.yml
//   mob_db_path: db/mob_db.yml          skill_db_path: db/skill_db.yml
// A table that fails to load is logged as an ERROR and its feature stays off: check the log after
// an update. (Full list: doc/CONFIGURATION.md.)
