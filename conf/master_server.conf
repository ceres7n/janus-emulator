// ProjectPAULA — MasterServer (SQL brain + inter-server hub :9010, internal only)
master_port: 9010
io_threads: 2

// Address to listen on. Keep 127.0.0.1: the hub has no authentication and serves
// character list / create / delete for any account. Only when the Login/GameServer
// run on another machine: set this machine's LAN address and let the firewall admit
// port 9010 from those hosts only. Never forward 9010 on the router.
bind_ip: 127.0.0.1

// Log detail: debug | info | warn | error.
log_level: info

// MariaDB
db_host: 127.0.0.1
db_port: 3307
db_user: root
db_pass:
db_name: janus
