// ProjectPAULA — LoginServer (char-select :8001). The client connects here with the
// token the AuthServer (:9980) issued; on char select it writes the one-time game
// ticket and sends the client to the GameServer.
port: 8001
io_threads: 2

// Address to listen on: 0.0.0.0 = every interface (players connect here), or one
// IPv4 address of this machine.
bind_ip: 0.0.0.0

// Log detail: debug | info | warn | error (debug logs every packet: large and slow).
log_level: info

// MariaDB (login_tokens and game_tickets; char data lives on the Master)
db_host: 127.0.0.1
db_port: 3307
db_user: root
db_pass:
db_name: janus

// Client packet cipher
paula_mode: true
sbox_path: tools/capture/sbox_cora.bin

// GameServer address handed to the client on char select (for players on other
// machines: the address they reach, e.g. your public IP)
game_server_ip: 127.0.0.1
game_server_port: 8002

// MasterServer hub (persistence relay)
master_ip: 127.0.0.1
master_port: 9010
