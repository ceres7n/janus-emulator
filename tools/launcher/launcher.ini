; PaulaLauncher settings. Put PaulaLauncher.exe and this file in your client
; folder, next to Trickster.bin, set LoginIP and Account, then start
; PaulaLauncher.exe. Lines that start with ; are comments; keep each comment on
; its own line (text after a value becomes part of the value).

[Launcher]
; The client to start. A relative path is relative to the folder of
; PaulaLauncher.exe. Default: Trickster.bin
TricksterPath=Trickster.bin

; The server IP baked into your Trickster.bin. Every copy of it in the client's
; memory is replaced with LoginIP. A comma-separated list is allowed. The
; default covers all known client builds, so most players never set this:
;OriginalIP=217.160.132.225,51.38.50.68,211.44.251.24

[Server]
; The server's IPv4 address, as the server operator gave it to you: digits and
; dots, at most 15 characters, no host names. Default: 127.0.0.1 (a server on
; this PC).
LoginIP=127.0.0.1

; The supported clients always connect to port 9980; the launcher only shows
; this value. Default: 9980
LoginPort=9980

; Your account name, as the server operator created it: 1-18 letters, digits
; or _. Running "PaulaLauncher.exe <account>" overrides it.
Account=
