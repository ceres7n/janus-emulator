; Janus Launcher settings. JanusLauncher.exe reads this file from its own
; folder and saves the values of its window here each time a client starts.
; Most players never edit it: use the launcher's window instead.
; Lines that start with ; are comments; keep each comment on its own line
; (text after a value becomes part of the value). ANSI and UTF-16 files both
; work.

[Server]
; The server's address, as the server operator gave it to you: an IPv4
; address (digits and dots) or a host name. Default: 127.0.0.1 (a server on
; this PC).
Address=127.0.0.1

; Your account name, as the server operator created it: 1-18 letters, digits
; or _. "JanusLauncher.exe <account>" fills in another one.
Account=

[Launcher]
; The client to start. A relative path is relative to the folder of
; JanusLauncher.exe. Default: Trickster.bin
;ClientPath=Trickster.bin

; The server IPs baked into the client, separated by commas. Each copy in the
; client's memory is replaced with the server address before the client runs.
; The default covers the supported client builds:
;ReplaceIPs=51.38.50.68,217.160.132.225,211.44.251.24

; The client's login arguments after the account. Leave them at their
; defaults. SessionKey is NOT a password (the server ignores it): 1-18 digits.
; Age: 0-255. Extras: letters, digits and _ . - | only.
;SessionKey=0
;Age=0
;Extras=blankblank0|0

; 1 = close the launcher's window when the game starts. Default: 0
;CloseOnStart=0
