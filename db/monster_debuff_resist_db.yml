# =============================================================================
#   Monster Debuff Resist Database  (MONSTER_DEBUFF_RESIST_DB)
# =============================================================================
#
#   Table MonsterDebuffResist of the ORIGINAL server data (kto_libconfig.xml, 7 rows):
#   what a boss (MonsterParamEx2 DebuffSet = the row's ID) shrugs off. For each bit i of a
#   skill's DebuffBitCode the i-th column below (sub_891F80): 100 = always resisted, n =
#   resisted when rand()%100 >= n, 0 / omitted = never; every bit resisted -> the boss takes
#   no effect state but S2C 1247 [u16 boss][u32 the resisted bits].
#
#   Fields
#     ID    - the DebuffSet                                           [key]
#     Name  - the original's description (Korean)
#     Stun           - bit  0 (0x00000001)
#     Paralysis      - bit  1 (0x00000002)
#     Stone          - bit  2 (0x00000004)
#     MagicPoison    - bit  3 (0x00000008)
#     Poison         - bit  4 (0x00000010)
#     RestrictAvoid  - bit  5 (0x00000020)
#     RestrictAttack - bit  6 (0x00000040)
#     RestrictSkill  - bit  7 (0x00000080)
#     RestrictHeal   - bit  8 (0x00000100)
#     AP             - bit  9 (0x00000200)
#     AC             - bit 10 (0x00000400)
#     DX             - bit 11 (0x00000800)
#     MA             - bit 12 (0x00001000)
#     MD             - bit 13 (0x00002000)
#     DA             - bit 14 (0x00004000)
#     LK             - bit 15 (0x00008000)
#     DP             - bit 16 (0x00010000)
#     HV             - bit 17 (0x00020000)
#     SPD            - bit 18 (0x00040000)
#     Cancler        - bit 19 (0x00080000)
#     APResist       - bit 20 (0x00100000)
#     GPResist       - bit 21 (0x00200000)
#     MAResist       - bit 22 (0x00400000)
#     ThunderResist  - bit 23 (0x00800000)
#     AirResist      - bit 24 (0x01000000)
#     WaterResist    - bit 25 (0x02000000)
#     EarthResist    - bit 26 (0x04000000)
#     FireResist     - bit 27 (0x08000000)
#     DarkResist     - bit 28 (0x10000000)
#     LightResist    - bit 29 (0x20000000)
#     Dimension      - bit 30 (0x40000000)
# =============================================================================

