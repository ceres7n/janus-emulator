#
#   Table RandomStatImportTable of the ORIGINAL server data (kto_libconfig.xml,
#   17 rows): the weight curves a rare item's random stats and compound slots
#   are rolled with (random_stat_db.yml *Import / MixSlotImport name one).
#
#   Fields
#     Name                    - curve name                              [key]
#     Step1, Step10..Step100  - weights at the points 0, 10, ..., 100 of the
#                               value range (0 = interpolate over it)
#   Retail DistrTblInfoMgr sub_616E70: the 11 weights become 101 (straight lines
#   between the non-zero steps), then a 10000-entry table of point indexes, each
#   point getting 10000*weight/total entries; a roll is table[rand() % 10000].
# =============================================================================

