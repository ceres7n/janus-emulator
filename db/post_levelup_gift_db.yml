# =============================================================================
#   Post Box Level-Up Gift Database  (POST_LEVELUP_GIFT_DB)
# =============================================================================
#
#   Table PostBoxLevelUpGiftInfo of the ORIGINAL server data (kto_libconfig.xml, 33 rows, in its
#   order): the GM gift a character gets in its gift box on reaching a level (retail Player
#   level-up sub_75D390 -> sub_76BE80 -> MCmd 3153 -> USPM_Send_GMGiftItem).
#
#   Fields
#     ID        - the row                                                    [key]
#     Level     - the level that sends it
#     ChrType   - the character types it goes to (bit type-1: 1 Bunny .. 256 Bear), OR-ed
#     Sender    - the GM name shown as its sender
#     Title / Message - the mail's title and text (UTF-8 here, CP949 on the wire)
#     Items     - up to 8: ItemId, ItemCount (ItemName = the original's label, display only)
# =============================================================================

