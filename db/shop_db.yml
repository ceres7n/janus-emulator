    NpcType: 5001
    Name: Item Girl
    PosId: 1
    PurchaseRate: 1
    SellingRate: 0.5
    ItemTable: R_ShopItem_Beach_Gate
    Script: Hello! I am Item Girl, for your information I have shops at each gate where I sell vaious basic items. If you want gear, and other special items, you will have to visit me at a shop inside one of the towns. Here in Desert Beach I will pay well for Fine Sand and Cocos nucifera's shell. Enjoy your stay!
  - Table: Shop_Relics
    NpcType: 5001
    Name: Item Girl
    PosId: 1
    PurchaseRate: 1
    SellingRate: 0.5
    ItemTable: R_ShopItem_Relic_Gate
    Script: Hello. Welcome to Caballa Relics. There are many items that are unique to this region like the Dutchman's Pipe and Tachyslite. Have you heard of them? Dutchman's Pipe can be acquired from the Guiana monsters and Tachyslite can be drilled for in the lower parts of Caballa Dungeon. They are rare and expensive items that can only be found here, so I will be buying them for a very high cost. So what can I help you with?
