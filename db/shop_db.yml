# =============================================================================
#   Shop Database  (SHOP_DB)
# =============================================================================
#
#   The shop tables of the ORIGINAL server data (kto_libconfig.xml: 70 Shop_* tables,
#   84 rows), referenced by maps_db.yml ShopTable. One record per row, in the
#   table's order; field names verbatim; a field only when it has a value.
#
#   Fields
#     Table        - the shop table                                      [key]
#     NpcType      - the shop's CharacterInfo id: its model
#     Name         - (derived) the CharacterInfo name of NpcType (Paula English
#                    when present, else the original)
#     PosId        - the .md3 type-5 point (by id) it stands on; none -> (600, 600)
#     PurchaseRate - the shop's buy price rate (<= 0 -> 1.0)
#     SellingRate  - the shop's sell price rate (<= 0 -> 0.5)
#     ItemTable    - its item list (shop_item_db.yml)
#     Script       - the greeting S2C 0x00A8 carries: the Paula backup's English text
#                    for the same row (80), else the original Korean
#   Retail: ShopManager::CreateShop (sub_882CF0) makes one ShopNpc (object kind 5)
#   per row at the zone build; GameInfoMgr sub_629D90 loads the rows.
# =============================================================================

Header:
  Type: SHOP_DB
  Version: 1

