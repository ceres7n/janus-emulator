# =============================================================================
#   Compound Database  (COMPOUND_DB)
# =============================================================================
#   Tables Compound_Potion, Compound_Rare and Compound_Throw of the ORIGINAL server data (GameInfoMgr
#   sub_62AD60: CompoundInfo, type 0 / 1 / 2 by table, keyed by CompoundID; Compound_Test is not read).
#   The player gives the ReqIDs (ReqNum each, times the spin count) and the Fee (times the spins, 10%
#   off from 10 spins); each spin succeeds with Probability (+ a DA bonus, at most 100) %: the ResIDs
#   for the successes, the WasteItem for the failures.
#
#   Fields
#     Table             - Compound_Potion (type 0), Compound_Rare (1: one spin only), Compound_Throw (2)
#     CompoundID        - the compound                                       [key]
#     Name, Comment     - display aids (the client names it)
#     ResLv             - (not read by the compound itself)
#     ResID1..3         - the items made (up to the first blank one)
#     ReqID1..5 / ReqNum1..5 - the items asked for (up to the first blank ReqID)
#     Probability       - the success rate, %
#     Fee               - the money it costs (per spin)
#     WasteItem         - the item a failed spin leaves
# =============================================================================

