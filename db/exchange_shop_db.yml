# =============================================================================
#   Exchange Shop Database  (EXCHANGE_SHOP_DB)
# =============================================================================
#   Table ExchangeShopContents of the ORIGINAL server data (2066 rows, in its order — a lookup
#   takes the first row of an ExchangeID; GameInfoMgr sub_62BD60 / sub_62C180). The player
#   gives the ReqIDs (at least ReqNum each) and the Fee, and gets one of each ResID.
#
#   Fields
#     ExchangeID        - the exchange                                      [key]
#     Name, Comment     - display aids (the client names it)
#     ResLv             - (not read by the server)
#     ResID1..3         - the items given (up to the first blank one)
#     ReqID1..5 / ReqNum1..5 - the items asked for (up to the first blank ReqID)
#     Fee               - the money it costs
# =============================================================================

