# =============================================================================
#   Boss Monster Database  (BOSS_MON_DB)
# =============================================================================
#
#   The BossMon_* tables of the ORIGINAL server data (kto_libconfig.xml, 239 tables,
#   333 rows; 21 tables empty), referenced by maps_db.yml BossMonsterTable. One record
#   per row, in the table's order; field names kept exactly as in the tables; a field
#   is written only when it has a value.
#
#   Fields
#     Table            - table name                                  [key]
#     BossMonID        - the boss (mob_db.yml Id)                    [key in the table]
#     BossMonCnt       - how many of it the map keeps
#     BossMonCheckTime - minutes between two spawns
#     BossMonRegionID  - the region (0 = the map's type-3 .md3 points)
#
#   (MapInfoEx BossMonsterCnt / BossMonCheckTime are not read by the server.)
#   Retail MonsterManager (GameServer sub_857F10 / sub_859AA0 / sub_85A3F0 / sub_85A480):
#   every 60 s each entry counts a minute; at BossMonCheckTime minutes, the missing
#   ones (BossMonCnt - alive) are spawned in the region when the last one died more
#   than 20 s ago, and the count restarts. A dying boss (Type 3 / 13) counts out of its
#   entry and stamps the time (sub_858B70).
# =============================================================================

