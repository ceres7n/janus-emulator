# =============================================================================
#   Map Item Database  (MAP_ITEM_DB)
# =============================================================================
#
#   Table MapItem_All of the ORIGINAL server data (376 rows, in its order): what a
#   drill digs up in each map. Field names verbatim; Name = the map's name in
#   maps_db.yml (display only); the item comments are item_db.yml names.
#
#   Fields
#     Id                       - the map (maps_db.yml ID)                         [key]
#     SpecialT / S_Rate        - type 0: a map_item_table_db.yml table and its rate
#     EquipT / E_Rate          - type 1
#     Normal1T..3T / N1..3_Rate - types 2..4
#     ItemN / RateN (0..29)    - type 5: the map's own items (both non-zero)
#   Retail: GameInfoMgr::LoadMapItemInfo (sub_640AE0) — the first row of the map;
#   type k's rate = (i16)(int)(Rate * (1 + Rate_Add) ) with Rate_Add of
#   map_item_event_add_db.yml Type 0 (S), 1 (E), 2 (N1..N3); the items of every
#   map_item_table_db.yml row named so; type 5's rate = the sum of its RateN.
#   MapItemManager::PopItemByRandom (sub_850890) picks a type by its rate, then an
#   item by the items' rates (type 5: the items an open quest needs x 4, Type 3).
# =============================================================================

