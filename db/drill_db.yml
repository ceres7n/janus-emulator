# =============================================================================
#   Drill Database  (DRILL_DB)
# =============================================================================
#
#   Table Item_DrillParam of the ORIGINAL server data (kto_libconfig.xml, 191 rows, in
#   its order): the drill of each Type-6 item (ItemParam +88). Field names verbatim;
#   Name = the item's name in item_db.yml (display only).
#
#   Fields
#     Id                - the drill's item id (item_db.yml Type 6)               [key]
#     Grade             - TM EXP 4*(3*Lv+depth)*Grade on a find; EXP rate row
#                         (drill_grade_exp_db.yml) of the dig's EXP
#     GroundNature      - 0 = any ground; else a ground of another nature
#                         (map_attr_db.yml Attr) costs twice the life
#     DigDepth          - the deepest result it may report (C2S 0x31)
#     BarEffArea / BarSpeed / ScoopMass - the client's dig gauge; also in the
#                         result's CRC and the server's shortest dig time
#     DrillLife         - the life (= the item's count) of a new drill
#     DrillEffect       - the client's effect name
#     CDM_*             - the Crazy Drill Mode (skill 5019): gauge max, stress bonus,
#                         seconds, BigBang ratio
#     RandomSpot_Ratio  - read by the drill event (sub_894860)
#     Wedding_*         - the wedding (CDM +60) gauge / BigBang bonuses
#   Retail: GameInfoMgr sub_625910 (struct: +8 Grade i16, +12 GroundNature, +16
#   DigDepth i16, +18 BarEffArea, +20 BarSpeed, +22 ScoopMass, +24 DrillLife, +288..
#   +312 the floats).
# =============================================================================

