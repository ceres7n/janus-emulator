# =============================================================================
#   Monster Database  (MOB_DB)
# =============================================================================
#   Generated from the ORIGINAL server data kto_libconfig.xml, table MonsterParamEx2
#   (1467 rows). Name = the English name of the Paula backup when it is the same
#   monster (same CharacterInfo model), else the original Korean name (display only).
#   The *Lv columns are the monster's ACTUAL stats at its own Level (the client stores
#   MaxHpLv directly, sub_614A50 @0x614A50), so MaxHp == the client's HP-bar maximum.
#
#   WalkSpeed/RunSpeed: units/s (retail actor +156/+160; chase speed +164 =
#   (Walk+Run)/2; a new monster starts at WalkSpeed — CommonMonster::Initialize
#   sub_7287E0). ChaseTime: seconds, raw; the loader applies the retail
#   InitializeMonsterParam rule ms = (int)(ChaseTime*1000), <= 0 -> 3000.
#
#   Type: MonsterParamEx2 Type (written when non-zero) — the monster class the
#   GameServer creates (MonsterManager::CreateChr sub_858E40); Type 3 is never
#   regenerated by the map's MonsterTable (sub_858B00).
#   Da: DaLv (stat 7, DA) — read by skills such as Shield Breaker (ESABreakBarrier).
#   DebuffSet: the MonsterDebuffResist row of a boss (written only when non-zero;
#   the retail param +2462, checked against a skill's DebuffBitCode, sub_891F80).
#
#   FireR WaterR WindR EarthR ElecR LightR DarkR NoPropR PhysicalR GunR ShadowR:
#   resistances in %% (MonsterParamEx2 names, written only when non-zero). Damage
#   is reduced by resist%% of itself (sub_5E6510 melee / sub_5E6760 skill); plain
#   physical damage uses PhysicalR, over 100 absorbs (heals) the rest.
#
#   AccFormula: MonsterParamEx2 AccFormula (the retail param +2460, written only when
#   non-zero). 1 = the monster's melee hit is rand(100) < max(10, (int)(Ac - (the
#   target's HV/100*15 + the target's level/Level*15))) (sub_5E5680) and its target
#   cannot evade or block it (sub_5E5700); else rand(100) < min(Ac, 90) (sub_5E4390).
#
#   Drops (MonsterParamEx2 names, written only when non-zero): ItemDropIdx = the
#   mon_item_drop_db.yml list, ItemDropCnt = item rolls on a kill (sub_729220),
#   GelderRate = gelder chance (fraction), GMin/GMax = gelder amount
#   GMin + rand() %% (GMax - GMin).
# =============================================================================

