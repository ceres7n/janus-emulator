#
#   Table Item_SkillCardParam of the ORIGINAL server data (kto_libconfig.xml,
#   305 rows): what a skill card item (Type 28 SubType 55) teaches and needs.
#   Field names verbatim; the Job text (a display list) is left out; Name = the
#   card item's name in item_db.yml.
#
#   Fields
#     ID                         - the card's item id                    [key]
#     SCardType / TMLV           - a class (card type -> class, sub_893990) the
#     SubSCardType / SubTMLV       player's class or one of its parents must be,
#                                  with at least that TM level (sub_893CB0);
#                                  both 0 = any class
#     AffectionPoint             - TM points the card costs
#     AffectionSkill             - the skill it teaches (skill_db.yml)
#     RegisterLevel              - the level the skill is learned at
#     PreSkill_n / PreSkillLv_n  - skills needed first, at least at that level
#     Options, JobType1, JobType2 - flags (the original lists OR'ed)
#   Retail use: UseSkilCardlHelper::Use (sub_6E7460) -> Player::CanLearnSkill
#   (sub_760760) -> S2C 0x020B; a failure answers S2C 0x01E4 [u8 5][u16 skill][u16 why].
# =============================================================================

