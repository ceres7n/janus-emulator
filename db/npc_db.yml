# =============================================================================
#   NPC Database  (NPC_DB)
# =============================================================================
#
#   The NpcTalk_<area> tables of the ORIGINAL server data (kto_libconfig.xml, 557
#   tables, 1775 rows), referenced by maps_db.yml NpcTable. One record per row, in
#   the table's order; field names kept exactly as in the tables; a field is
#   written only when it has a value.
#
#   Fields used by the GameServer so far
#     Table   - table name                                              [key]
#     Type    - the NPC's CharacterInfo id (1000..1449 or 17000..479999): its model
#     Name    - (derived) the CharacterInfo CommonName of Type — the retail sends it
#               (sub_622CD0) — from the Paula backup's CharacterInfo when it has the
#               id (English), else the original (Korean)
#     PosId   - the .md3 type-4 point (by id) the NPC stands on; none -> (600, 600)
#   (the rest — QuestId*, TeleportId, MsgTable, ExcShopTable, SkillId, SubType,
#   HeadMarkType, ... — kept for the dialogs, shops and quests)
#
#   Spawn (retail NpcManager, GameServer sub_85DDC0 / sub_85DE20): at the world
#   build every row of a map's NpcTable becomes an NPC (object kind 2) of its
#   Type at its point, named after Type.
# =============================================================================

