#   Fields
#     ID      - the skill (skill_db.yml)                                 [key]
#     MpRate  - MP / MaxMP (as a float) must be at least this
#     HpRate  - HP / MaxHP (as a float) must be at least this
#   Retail use: the checks right before a skill fires (sub_890B30 ->
#   sub_890DD0, the GameInfoMgr map loaded by sub_625470 "PreESAICondition"): a
#   skill with a row and less HP or MP -> S2C 0x01E4 [10][0][0] and the
#   cancel reason 15 (S2C 239); a skill without a row always passes.
# =============================================================================

