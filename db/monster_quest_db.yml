# =============================================================================
#   Monster Quest Database  (MONSTER_QUEST_DB)
# =============================================================================
#   Table MonsterQuestInfo of the ORIGINAL server data (600 rows) — a monster quest (GameInfoMgr
#   sub_629D10 area). A player takes the grade whose MinLvN..MaxLvN holds his level: kill CntN of
#   SrcMonsterN within TimeN minutes. The texts are sent with the quest (S2C 0x00D2); the Paula
#   backup's English when it is the same quest and intact, else the original Korean. The
#   Comment is the client's format ("%s %d minutes, %d kills").
#
#   Fields
#     Id                  - quest id                                          [key]
#     Name, Client, Pos, Comment - the quest's texts
#     MinLevel / MaxLevel - the level range (both 0: any)
#     SrcMonsterN, CntN, TimeN, MinLvN, MaxLvN, ExpN, TmxpN, MapIdN - grade N (0..4)
#     ResultTable         - its MonsterQuestResult table (monster_quest_result_db.yml)
#     MaxCount            - how many times (0 or less: 25; 99 and more: no limit)
#     ReturnMapID         - the map the success portal brings back to (0: none)
# =============================================================================

