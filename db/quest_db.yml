# =============================================================================
#   Quest Database  (QUEST_DB)
# =============================================================================
#   Table QuestInfo of the ORIGINAL server data (1819 rows) — a normal quest (GameInfoMgr
#   sub_625D00). Name / Client / Pos / Comment are sent to the client when the quest is taken
#   (S2C 0x0084); the Paula backup's English when it is the same quest (same items, result
#   table and MaxCount) and intact, else the original Korean.
#
#   Fields
#     Id                - quest id                                            [key]
#     Name, Client, Pos, Comment - the quest's texts
#     MinLevel/MaxLevel - the level range to take it (both 0: any)
#     Exp / Tmxp        - EXP / TM EXP added to the result's own
#     SrcItemN / CntN   - the items it asks for (N = 0..5; Cnt is 1 for an item with
#                         ItemParam Options & 1)
#     SrcSkill0 / SrcSkillLv0 - a skill it asks for (and its level)
#     SrcGelder         - the money needed to be offered it
#     ResultTable       - its QuestResult table (quest_result_db.yml)
#     MaxCount          - how many times it can be done (0 or less: 25; 99 and more: no limit)
#     RefId, Options    - Options 2 = the reward tier follows how many of SrcItem0 are brought
# =============================================================================

