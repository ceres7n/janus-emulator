# =============================================================================
#   Gun Database  (GUN_DB)
# =============================================================================
#
#   Table Item_GunParam2 of the ORIGINAL server data (kto_libconfig.xml,
#   597 rows): the gauge and the attack ranges of a gun (an item of SubType 54).
#   Field names verbatim; zero fields left out; Name = the gun item's name in
#   item_db.yml. An ID listed twice keeps its FIRST row (3580, 52001): the
#   retail GunParam hash list appends a duplicate to its bucket and the lookup
#   (sub_625C30 -> sub_687AC0) returns the first match.
#
#   Fields
#     ID                          - the gun's item id                     [key]
#     GunType                     - the gun's kind
#     GaugeSpeed                  - how fast the client's reload gauge fills; the
#                                   server's shortest time between two shots is
#                                   (int)((int)(20000 / (GaugeSpeed / 6)) * 0.7) ms
#     PowRange / PowStartPoint    - the client's power-shot window on the gauge;
#                                   with GaugeSpeed they key the shot's CRC
#     MinAttackRange / MaxAttackRange - the player's attack ranges while the gun
#                                   is equipped (approach = 3*(Min+Max)/4)
#   Retail use: the equip effect sub_717E70 (ranges, GunAttackStrategy +
#   NormalBattleFollowing), CMD_BEGIN_ATTACK_GUN (C2S 0x01DD, Player case 477).
# =============================================================================

