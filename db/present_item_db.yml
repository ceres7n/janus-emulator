#     Type                  - 0 random / 1 random, distinct / 2 in order
#     DropCnt               - the picks
#     DropId_<i>            - slot i's item (0..19; 0 = no slot)
#     DropRate_<i>          - its weight
#     ItemCnt_<i>           - how many (0 -> 1)
# =============================================================================

