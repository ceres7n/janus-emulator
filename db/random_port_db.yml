# =============================================================================
#   Random Port Database  (RANDOM_PORT_DB)
# =============================================================================
#
#   Table RandomPortParam of the ORIGINAL server data (kto_libconfig.xml, 51 rows,
#   in its order): where a broom / port item (Type 15, Effect 28) sends its user.
#   Field names verbatim; Name = the item's name in item_db.yml (display only);
#   zero slots are left out.
#
#   Fields
#     ID           - the item                                         [key]
#     Notice       - the text shown on use (S2C 758)
#     ZoneID_n / Ratio_n (n = 0..19) - the destinations and their weights; only a
#                    ZoneID 1..999 counts (the slots are packed in order)
#   Retail use: UseItemHelper::Use case 28 picks rand() %% (the sum of the counted
#   Ratios) against them in order (sub_6E0010), then the type-3 zone change to a
#   random type-7 point of that zone.
# =============================================================================

