# =============================================================================
#   Compounder Database  (COMPOUNDER_DB)
# =============================================================================
#   Table Compounder_Info of the ORIGINAL server data and the lists it names (GameInfoMgr sub_62B0E0 /
#   sub_62B210: at most 64 lists, in order) — an NPC's CompounderTable (npc_db.yml) is the first list
#   of that name; Compound_Start sends its visible CompoundIDs (S2C 188) with its Grade.
#
#   Fields
#     ListName     - the list (one record per row of it, in its order)     [key]
#     Grade        - the list's grade (sent with it); on every row of the list
#     CompoundID   - a compound (compound_db.yml)
#     Probability  - (not read by the compound itself)
#     Hidden       - 1: not listed to the client
# =============================================================================

