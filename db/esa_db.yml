# =============================================================================
#   Skill Effect Tables  (ESA_DB)
# =============================================================================
#
#   The ESAII_* / ESAUI_* / ESAction_* tables of the ORIGINAL server data
#   (kto_libconfig.xml), referenced by skill_db.yml ESAIITable / ESAUITable /
#   ESATable. One record per table row; field names kept exactly as in the table.
#   Every column is written, zeros included (the retail loader makes each ESAII
#   column an invocation condition, so a zero Range is not an absent Range).
#
#   Fields
#     Table  - table name                                  [key]
#     Level  - skill level of the row                      [key]
#     ESAII_*:  Delay (cast time s, players) / MonDelay (monsters), MpCon, HpCon,
#               Range, CoolTime (s), MinLv, MaxLv, MinApLv, MaxApLv, HpRate,
#               MpRate, HeightType, Probability
#     ESAUI_*:  Options ... (selection UI)
#     ESAction_*: per-action values (e.g. Ratio = AP multiplier, ApplyRatio =
#               hit-chance multiplier of ESAction_Steel_Punch)
# =============================================================================

