# =============================================================================
#   Random Stat Database  (RANDOM_STAT_DB)
# =============================================================================
#
#   Table RandomStatValueTable of the ORIGINAL server data (kto_libconfig.xml,
#   3141 rows): the random stats and compound slots of a new rare item.
#   Field names verbatim; a stat without an Import is not rolled and left out.
#
#   Fields
#     ItemId                          - item id (item_db.yml)        [key]
#     <Stat>Min / <Stat>Max / <Stat>Import - the stat's value range and its curve
#        (random_stat_import_db.yml); Stat = AP AC DX MP MA MD WT DA LK HP DP HV
#        GunAp, rolled as item option 10000..10012 (option type 10)
#     MixSlotMin / MixSlotMax / MixSlotImport - the compound slot count (the rare
#        item's byte 3); without it the item's CompoundSlot is used
#   Retail (sub_617590): the range becomes 101 values, Min + k*(Max-Min)/100
#   (float steps, value 100 = Max); a roll takes value[curve[rand() % 10000]].
#   Only items with OptionsEx flag 1 roll their stats (sub_6E02D0); every new rare
#   item rolls its slots (sub_6EC2B0).
# =============================================================================

