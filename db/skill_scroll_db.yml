# =============================================================================
#   Skill Scroll Database  (SKILL_SCROLL_DB)
# =============================================================================
#
#   Table SkillScroll_Info of the ORIGINAL server data (kto_libconfig.xml,
#   82 rows, in its order): the skill a scroll item (Type 15, SubType 69) casts.
#   Field names verbatim; Name = the item's name in item_db.yml, Skill = the
#   skill's name in skill_db.yml (display only).
#
#   Fields
#     ItemId   - the scroll item                                       [key]
#     SkillId  - the skill it casts (its own, not a learned one)
#     Level    - the level it is cast at
#   Retail use: the client sends C2S 844 [u64 uid][u16 skill] (sub_BEB290); the
#   server (Player case 844) casts SkillId at Level when it is the item's row and
#   keeps the item (Player +0xC94); the skill's effect state of ESClass 4/5/6 uses
#   the item up (UseItem -> sub_6E59C0: S2C 0x0059). The first row of an item
#   wins (a front-to-back search, sub_636E70).
#   SkillId not in SkillParam2 (the scroll cannot work): 7006, 7023
# =============================================================================

