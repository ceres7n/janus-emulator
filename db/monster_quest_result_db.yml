# =============================================================================
#   Monster Quest Result Database  (MONSTER_QUEST_RESULT_DB)
# =============================================================================
#   The MonsterQuestResult_* tables of the ORIGINAL server data (622 tables) — a monster quest's
#   results (MonsterQuestInfo ResultTable; GameInfoMgr sub_627F60), one row per Grade (the row
#   list is indexed by Grade; a grade past the last row reads the last). MsgN are the quest's
#   m<N> dialog messages (of the grade the player took): the Paula backup's English when it is
#   intact and has the same options, else the original Korean.
#
#   Fields
#     Table          - MonsterQuestResult table name                           [key]
#     Grade          - the grade the row is for
#     Type           - 1 = one of the items at random (and one random table), 0 = all
#     ItemN / CntN   - reward items (N = 0..3; Cnt is 1 for an item with Options & 1)
#     Gelder         - money (EXP / TM EXP come from MonsterQuestInfo's grade)
#     Msg0..Msg9     - the m0..m9 messages (up to the last non-empty one)
#     RandomTableID0..2 - random_result_item_db.yml tables
# =============================================================================

