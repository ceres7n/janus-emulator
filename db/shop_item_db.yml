# =============================================================================
#   Shop Item Database  (SHOP_ITEM_DB)
# =============================================================================
#
#   The item tables the shops of shop_db.yml name (ORIGINAL server data
#   kto_libconfig.xml, 68 tables, 2225 rows), one record per row in table order;
#   field names verbatim; a field only when it has a value.
#
#   Fields
#     Table        - the item table                                       [key]
#     ItemId       - the item sold (item_db.yml)
#     Name         - (display only) the item's item_db.yml name
#     PurchaseRate - its own buy rate (> 0 replaces the shop's)
#     SellingRate  - its own sell rate (> 0 replaces the shop's; > 0 also lists it
#                    in the shop's sell rates, S2C 0x00A9)
#     OutOfStock   - 1 = not offered (left out of the buy list, S2C 0x0047)
#   Retail: GameInfoMgr sub_62A0A0 keeps the first 128 rows of a table.
#   Buy price (sub_720160): (int)(map ShopPriceRate x item Value x rate + 0.5);
#   sell price (sub_720210): (int)(map ShopPriceRate x item value x rate), >= 1.
# =============================================================================

