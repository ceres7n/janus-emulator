# =============================================================================
#   Item Rebirth Database  (ITEM_REBIRTH_DB)
# =============================================================================
#
#   Table Item_RebirthParam of the ORIGINAL server data (kto_libconfig.xml,
#   10 rows, in its order): what a resurrection item restores. Field names
#   verbatim; Name = the item's name in item_db.yml (display only).
#
#   Fields
#     ItemId             - the item (item_db.yml: Type 15, Effect 29)   [key]
#     fHpRestoreRatio    - HP = (int)(MaxHP * ratio)
#     fMpRestoreRatio    - MP = max(MP, (int)(MaxMP * ratio))
#     fExpRestoreRatio   - EXP += (int)(the EXP the death cost * ratio)
#     fTmxpRestoreRatio  - TM EXP += (int)(the TM EXP the death cost * ratio)
#   Retail use: Resurrect on the death screen (C2S 0x02F7) above
#   BeginnerRebirthInfo.Level uses the bag's Effect-29 item: UseItemHelper::Use
#   (sub_6E1AE0) case 29 -> the revive (sub_764260) with these ratios. An Effect-29
#   item without a row here cannot be used.
# =============================================================================

