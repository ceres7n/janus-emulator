# =============================================================================
#   Monster Spawn Database  (MON_SPAWN_DB)
# =============================================================================
#
#   The Mon_<area> tables of the ORIGINAL server data (kto_libconfig.xml, 577 tables,
#   2111 rows), referenced by maps_db.yml MonsterTable. One record per table row, in the
#   table's order; field names kept exactly as in the tables; a field is written only
#   when it has a value (zero / empty left out: Avr, Max, Region default to 0).
#
#   Fields
#     Table      - table name                                         [key]
#     MonsterID  - the monster (mob_db.yml Id)
#     Ratio      - the monster's share of the map's MonsterAvrNum (float; the
#                  retail keeps the LAST row's Ratio of a MonsterID)
#     Avr        - the target count in this region (0 -> MonsterAvrNum * Ratio /
#                  the table's sum of (int)Ratio)
#     Max        - the cap in this region
#     Region     - the region: 0 = the map's type-3 .md3 points, else the type-6
#                  points whose id is this region
#     TimeTable / RetrMonNumType / RetrMonNum - unused by this data (all empty / 0)
#
#   Regeneration (retail MonsterManager, GameServer sub_859AA0 / sub_859760 /
#   sub_858C90): while a map holds fewer monsters than its MonsterAvrNum, each
#   (MonsterID, Region) below its target and its Max gets one more monster per
#   tick, at a random point of the region; MonsterParamEx2 Type 3 is never
#   regenerated (sub_858B00).
# =============================================================================

