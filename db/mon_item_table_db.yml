#     Item0..19 / Rate0..19 / Cnt0..19 - item, chance (fraction), amount (0 -> 1)
#   Retail loader (GameInfoMgr sub_6368E0): total = (int)(sum*10000), or 10000 with
#   the chances scaled down when the sum is over 1.0; bands of (int)(chance*10000).
#
#   ROW ORDER MATTERS — keep the original order, do not sort. The retail loader
#   reads every row into the SAME 20-slot buffer, stores each item at its slot
#   number, counts the filled slots, then uses slots 0..count-1. A row with an
#   empty slot in the middle (ID 200: slot 7) therefore uses that slot's values
#   left over from the previous rows, and loses its last item (slot 18).
# =============================================================================

