# =============================================================================
#   Item Refine Levels  (ITEM_REFINE_DB)
# =============================================================================
#   Table RefineLevelTable of the ORIGINAL server data (kto_libconfig.xml): per RefineIndex
#   (ItemParam RefineIndex), the per-level accumulated bonus and success rate of the refine
#   (sub_630210: AccumulationLv1..13 / RatioLv1..13; index 1 = refine level 1).
#
#   Fields
#     RefineIndex   - ItemParam RefineIndex                                  [key]
#     Comment       - the original grade name (display aid)
#     Accumulation  - 13 ints: the type-11 option value at refine level L =
#                     Accumulation[L] * (the item's type-10 base option of the refine stat) / 100
#     Ratio         - 13 floats: the success rate (%) of refining TO level L
# =============================================================================

