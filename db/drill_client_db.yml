# =============================================================================
#   Drill Client Database  (DRILL_CLIENT_DB)
# =============================================================================
#
#   The Item_DrillParam values of other clients, for the drills the server has
#   (drill_db.yml) where they differ. A client keys the C2S 0x31 dig result's CRC
#   with ITS libconfig's BarEffArea / BarSpeed / ScoopMass and stops its gauge at
#   its DigDepth (client sub_494880 / sub_422D80, the same code in the Paula and the
#   Season 2 builds), so a Season 2 client (its data\libconfig_twn.dat) fails the
#   server's check with the Paula values and is cut (CMD_END_DRILL: crc is
#   invalid). The Season 2 GameServer does the very same check with its own data
#   (GameServer sub_4EF5A0 CMD_END_DRILL, the shortest time sub_59D820).
#   drill.cpp tries the server's row first, then these rows of that drill: the one
#   whose CRC matches gives the depth limit and the shortest dig time; the life,
#   the ground, the Grade (EXP / TM) stay the server's.
#
#   Fields
#     Id         - the drill's item id (drill_db.yml)                       [key, repeated]
#     Source     - where the values come from
#     DigDepth / BarEffArea / BarSpeed / ScoopMass - that client's values
#
#   Sources (decrypted with the TO-Toolbox libconfig key, XTEA "#ShowMeTheMoney#"):
#     PolarPandaS2 - the PolarPandaTO (Season 2) game files: PandaTO\data\libconfig_twn.dat
#     S2Release    - the trickster-online-s2-server-release package:
#                    TS_TUpdate\GameServer1\data\libconfig_twn.dat
# =============================================================================

