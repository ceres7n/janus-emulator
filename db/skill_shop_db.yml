# =============================================================================
#   Skill Shop Database  (SKILL_SHOP_DB)
# =============================================================================
#   The SkillShopTalk_* tables of the ORIGINAL server data named by maps_db.yml SkillShopTable
#   (24 tables): each row a SkillShopNpc (object kind 14) of its map at its .md3 type-10 point —
#   the skill / job masters (SkillShopManager::CreateSkillShop sub_883130; GameInfoMgr sub_62A3C0).
#
#   Fields
#     Table          - the table (maps_db.yml SkillShopTable)                        [key]
#     Type           - the NPC's CharacterInfo id (its model)
#     Name           - (derived) the CharacterInfo name of Type
#     PosId          - its .md3 type-10 point
#     JobQuestID     - the change-job quest (QuestInfo) of its CJQuest functions
#     LimitJobType   - the job a job change asks for (0: any)
#     ChangeType     - the job change's type (S2C 568)
#     ChangeJob      - the job it gives
#     PurchaseRate / SellingRate - the shop's default rates
#     ItemTable      - its shop list (skill_shop_item_db.yml)
#     LimitSkillMaster - the skills it masters (limit_skill_master_db.yml)
#     NpcSType<i> / Message<i> - its messages 0..20 (up to the last one written); a message is the
#                      text, then '\'-separated label / action pairs (parsed by the client)
# =============================================================================

