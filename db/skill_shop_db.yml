    Message2: You have proved yourself at the Door of Tribulation. However, you are not completely awakened yet. In order to become a true Trickster, you must become a Champion.\Continue\19
    Message3: You are better than I thought. Let me tell you about the compass you've brought me before I turn it into a Compass of Light. The compass you've brought me has 16 stones which represents the 16 guardians. I'll make the needle with the Harkon you've brought. The needle made from Harkon will always point towards Poseidon's Blessing which is a statue made of Harkon.\I'll think about it\5\Let's make it\CJQuest2_Complete,q4,q5,q4,20
