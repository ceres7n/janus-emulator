    Message5: Not ready yet? You have to trust yourself. I hope you can make a decision next time.\I'll be back later\SkillShop_Exit
    Message6: You are ready to become stronger now. What are you waiting for? Your new power awaits you now.\Advance later\9\Advance\CJUIOpen
    Message7: You are not ready to advance to your next job. You must be at least Level 130 and TM Level 120. Be stronger.\Exit\SkillShop_Exit
    Message8: This is not the road you want to take. Only a Boxer can become a Champion.\Exit\SkillShop_Exit
    Message9: Not ready yet? Trust yourself. I hope you make the decision next time.
    Message10: The endless white ocean. It is an ocean that is not an ocean. Someone who received my revelation will be lending you a hand. Go seek his help.
    Message11: OK. It is my duty to tell you the truth. You should know about the fall of the Alteo Empire. Our master Morpheus made an agreement with Poseidon when the empire was falling. We were sent to keep that agreement.\Exit\SkillShop_Exit\What agreement?\12\*\*block
    Message12: When Nereides terrible vengeance came Poseidon was powerless to stop it. For he wished to prevent any future conflict between the gods. In order to protect Nefertiti he turned her into a statue of Harkon and tasked 16 guardians with the duty of protecting her.\Stop listening\SkillShop_Exit\So what happened?\13\*\*block
    Message13: The only way to locate where they were resting was to use Morpheus' power. Nereides learned this fact and took the initiative with Morpheus.\Stop listening\SkillShop_Exit\What about Poseidon?\14\*\*block
    Message14: Poseidon gave Morpheus more power in exchange for Nefertiti's peaceful sleep and become her guardian when needed.\Stop listening\SkillShop_Exit\And?\15\*\*block
    Message15: What Morpheus gained from this agreement was the power to show dreams and images from the unconscious world. In other words, he was able to see and display dreams.\Stop listening\SkillShop_Exit\What if Morpheus betrays?\16\*\*block
    Message16: But that power is given only under Nefertiti's safety. It is to prevent Morpheus from taking her side. My story ends here.\I see. So that was the story\SkillShop_Exit
    Message17: Don't try learning more skills from me. The harder it is to obtain, the more valuable it gets. You can find new skills by drilling or from NPC shops and various creatures occupying Caballa Island.
