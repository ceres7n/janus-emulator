    Message0: Welcome. I am the Messenger of Morpheus, Controller of the Dream World and the Unconcious and the guardian of Poseidon's Blessing.\Exit\SkillShop_Exit\Master a Skill\1\Sell a Skill Card\SkillShop_Sell\Buy a Skill Card\17\Advance to Champion\CJQuest2_Check,2,3,4,6,7,8,20\Who are you?\11
