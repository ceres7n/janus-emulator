    Message10: Whether it's an endless white sea or a vast desert, I am here to assist you in receiving your revelation. Let's join forces and lend our support to help you accomplish your goal. Together, we will embark on this journey and overcome any obstacles that come our way. Let's move forward with determination and anticipation.
    Message11: Ok. It is my duty to tell you the truth. You should know about the fall of the Alteo Empire. Our master Morpheus made an agreement with Poseidon when the empire was falling. We were sent to keep that agreement\Quit talking.\SkillShop_Exit\What's the deal?\12\*\*block
    Message12: When Nereides terrible poison came Poseidon was powerless to stop it. For he wished to prevent any future conflict between the gods. In order to protect Nefertiti he turned her into a statue of Harkon and tasked 16 guardians with the duty of protecting her.\I had enough.\SkillShop_Exit\So what happened?\13\*\*block
    Message13: 누구도 찾지 못하는 깊고 비밀스러운 장소에서 낌새를 감추고 잠들어버린 그들을 찾을 유일한 방법은 그들이 꾸는 꿈을 지배하는 모르페우스의 능력을 빌리는 것이었다. 네레이데스가 그 사실을 알고 모르페우스를 불러 그들을 찾아내기 전에 포세이돈이 먼저 선수를 쳤다.\그만 들을래.\SkillShop_Exit\모르페우스라…. 포세이돈이 취한 조치는?\14\*\*block
    Message14: Poseidon is more powerful than Morpheus and commands Nefertiti and the 16 Guardians to defend the surface of the Earth. However, Nefertiti only responds to the Messenger alone.\Listen, that's enough.\SkillShop_Exit\so?\15\*\*block
    Message15: Morpheus made a deal to gain the ability to unify the dream world on his own. As a result, he was able to create images of reality and awareness in the unconscious world, which means that dreams can take on physical form.\Listen, that's enough.\SkillShop_Exit\However, just one ability betrayed Morpheus?\16\*\*block
