    Message11: 좋다. 당신에게 진실을 전하는 것도 나의 임무. 당신은 알테오 제국의 멸망에 관한 얘기는 알고 있겠지? 우리를 지배하는 주인 모르페우스는 오래 전, 알테오 제국이 멸망으로 치달을 때 포세이돈과 협약을 맺은 적이 있다. 그 협약에 따른 약속을 지키기 위해 우리를 보낸 것이다.\나가기\Exit\협약이 뭐지?\12\*\*block
    Message12: 대재앙과 네레이데스들의 복수가 시작되었을 때, 포세이돈은 그것을 막지 못했다. 이유는 다른 신들과의 분란으로 문제가 커지는 것을 피하기 위해서였다. 대신, 네페트리를 지키기 위해 그녀를 정령으로 만들어 불멸의 성질을 가진 하르콘 조각상과 일체가 되도록 했고, 열 여섯의 수호자들에게 하르콘의 조각상과 함께 위험을 피해 은둔할 것을 명했다. \그만 들을래.\Exit\그래서 어떻게 됐어?\13\*\*block
    Message13: 누구도 찾지 못하는 깊고 비밀스러운 장소에서 낌새를 감추고 잠들어버린 그들을 찾을 유일한 방법은 그들이 꾸는 꿈을 지배하는 모르페우스의 능력을 빌리는 것이었다. 네레이데스가 그 사실을 알고 모르페우스를 불러 그들을 찾아내기 전에 포세이돈이 먼저 선수를 쳤다.\그만 들을래.\Exit\모르페우스라…. 포세이돈이 취한 조치는?\14\*\*block
    Message14: 포세이돈은 모르페우스에게 더욱 강력한 힘을 부여하는 대신, 누구의 명령이 있더라도 네페트리와 열 여섯의 수호자들의 수면 세계를 지켜주며, 네페트리의 부름에만 응답하여 그녀가 필요로 할 때 전령사가 되어 주기로 한 것이다.\그만 들을래.\Exit\그래서?\15\*\*block
    Message15: 이 협약의 대가로 모르페우스가 얻은 것은 꿈과 무의식의 세계에서만 만들 수 있었던 형상을, 현실과 의식이 세계에서도 보여줄 수 있는 힘이었다. 즉, 꿈을 의식 밖의 형상으로 끄집어낼 수 있게 된 것이었다.\그만 들을래.\Exit\하지만, 모르페우스가 능력만 얻고 배신하면?\16\*\*block
