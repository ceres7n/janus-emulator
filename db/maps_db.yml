# =============================================================================
#   Maps Database  (MAPS_DB)
# =============================================================================
#
#   MapInfoEx of the ORIGINAL server data (kto_libconfig.xml, 695 maps; the retail
#   InitializeMapInfo keeps ids 1..999). Field names are kept exactly as in
#   MapInfoEx. Classification fields (ID, Class, PZType, Type, Group, WMRegion,
#   Name) are always present; every other field is written only when it has a
#   real value (non-empty string / non-zero number), rAthena-style.
#   Only the maps listed here exist for the GameServer (@warp included).
#
#   A map with Type 1 or 2 and Class != 3 becomes the player's return town when
#   the player enters it (Player vtbl+60 sub_73AA70).
#
#   Fields (from MapInfoEx FIELDINFO)
#     ID               - map id (characters.zone)            [key]
#     Class            - map class (Enum); retail Zone +20 (BuildWorld sub_818B60)
#     PZType           - peace-zone type (Enum)
#     Type             - map type id (MapType; name in the comment); retail Zone +16
#     Group            - world group (Enum)
#     WMRegion         - world-map region (Enum)
#     Name             - map name (English from the Paula backup when it is the same map)
#     FileName         - .md3 geometry file
#     MiniMap          - minimap .nri
#     MapSign          - map sign .nri
#     MaxDepth         - max dungeon depth
#     MonsterAvrNum    - average monster count
#     MonsterTable     - spawn table
#     BossMonsterTable - boss spawn table
#     ItemPercentage   - ground-item drop %
#     MaxItem          - max ground items
#     MinItemDepth / MaxItemDepth - ground-item depth range
#     ItemDelaySec     - ground-item respawn delay (s)
#     ItemTable        - ground-item table
#     ShopPriceRate    - shop price multiplier
#     ShopTable        - shop table
#     NpcTable         - npc table
#     MonsterTactics   - monster tactics table
#     BGEffectFileName - background effect file
#     SkillShopTable   - skill shop table
#     BossMonsterCnt   - boss count
#     BossMonCheckTime - boss respawn check (s)
#     Option           - option flags (Enum)
#     SubType          - sub type (Enum)
#     NoShader         - disable shader (bool)
#
#   Extra fields (not MapInfoEx)
#     Town             - the town of this map, for the ProjectPAULA option
#                        `restart_town: zone` (game_server.conf). NOT retail data:
#                        the map itself if it is a town -> the only town of its
#                        Group -> the nearest town by portal links (ties: same
#                        Group, then same WMRegion) -> the only town of its
#                        WMRegion; absent = none (falls back to the last visited
#                        town). Edit freely.
#     Type2Points      - the map's default arrival points, read from its .md3 like
#                        Zone::BuildPoints (sub_8113C0); a random one is used
#                        (sub_8133D0). Point = [Id, Param, X, Y]
#     Type1Points      - portal arrivals; Param = the map you arrive from
#                        (sub_810CF0); a random one is the default when there is
#                        no type-2 point (sub_810D70); otherwise (500,400)
#     Type7Points      - teleport arrivals (an NPC teleport, changeZoneType 3:
#                        sub_810A60 -> sub_813420, a random one; none -> the
#                        default arrival)
#     Type9Points      - NPC move destinations (NpcMoveInfo DestId = the point Id;
#                        changeZoneType 4: an invalid position -> the first one,
#                        sub_810AD0 -> sub_813470)
# =============================================================================

