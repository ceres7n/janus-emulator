# =============================================================================
#   Pet Speech Database  (PET_SPEECH_DB)
# =============================================================================
#
#   From the ORIGINAL server data (kto_libconfig.xml): the PetSpeech / PetSpeech_* tables that
#   PetParam.Speech names (pet_param_db.yml). One entry per line: its table, the Type (the
#   situation - 1: 0 idle, 1 battle, 2 owner died, 3 owner runs, 4 equipped, 5 HP low, 6 MP low,
#   7 level up, 8 TM level up, 9 sit, 10 rest, 11 money (C2S 1036), 12 pick-up / quest 2,5,
#   13 throw away, 14 quest done, 15 quest time running out, 16 drill, 17 refine failed,
#   18 refine done, 19 / 20 special pick-ups, 21 boss killed), the slot, the Ratio (the chance
#   out of 1.0, cumulative per Type: retail loader sub_620C50 stops at the first empty Speech),
#   the line and its Voice (a sound name, mostly empty). Only PetSpeech_VoiceTest (the test pet
#   4262, item 1762) has the Types 5..21; every other table has 0..4. A Type repeated in a table
#   (3 rows) is left out: the retail hash list appends (sub_674B50) and its lookup (sub_60F370)
#   finds the first row.
# =============================================================================

